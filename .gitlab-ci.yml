stages:
  - lint
  - build
  - package
  - lint packages
  - publish

# ---
# Abstract jobs.
# ---

.build:
    stage: build
    rules:
        - if: $CI_COMMIT_BRANCH == "develop"
        - if: $CI_COMMIT_TAG
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          changes:
          - "chars/**/*"
          - "cli/**/*"
          - "common/**/*"
          - "include/**/*"
          - "lib/**/*"
          - "CMakeLists.txt"
          - ".gitlab-ci.yml"
    script:
        - ./misc/build.sh
    variables:
        CMAKE_BUILD_TYPE: "Release"
        CAHUTE_CLI_EXPERIMENTAL: "ON"
    artifacts:
        paths:
            - build

.build (debian):
    extends: .build
    variables:
        CMAKE_INSTALL_LIBDIR:
            value: "/usr/lib/$DEB_HOST_MULTIARCH"
            expand: true
        CMAKE_INSTALL_PREFIX: "/usr"
        CAHUTE_APPSTREAM: "ON"
        CAHUTE_CLI_PIE: "ON"
        CAHUTE_INSTALL_UDEVDIR: "/usr/lib/udev"
        CAHUTE_SHARED: "ON"
        CAHUTE_UDEV: "ON"
        CAHUTE_UDEV_GROUP: "dialout"

.build (arch):
    extends: .build
    variables:
        CMAKE_INSTALL_PREFIX: "/usr"
        CAHUTE_CLI_PIE: "ON"
        CAHUTE_SHARED: "ON"
        CAHUTE_UDEV: "ON"
        CAHUTE_UDEV_GROUP: "uucp"

.build (mingw-w64):
    extends: .build

.build docs:
    stage: build
    image: registry.gitlab.com/cahute/docker-images/sphinx:latest
    script:
        - sphinx-build -M html docs docs/_build
    artifacts:
        paths:
            - docs/_build/html

.package for debian:
    stage: package
    rules:
        - if: $CI_COMMIT_BRANCH == "develop"
        - if: $CI_COMMIT_TAG
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          changes:
          - ".gitlab-ci.yml"
          - "CMakeLists.txt"
    script:
        - cd build && cpack -G DEB
    artifacts:
        paths:
            - build/*.deb

.publish docs:
    stage: publish
    image: registry.gitlab.com/cahute/docker-images/rsync:latest
    before_script:
        - chmod 400 "$SSH_PRIVATE_KEY"
        - ssh-add "$SSH_PRIVATE_KEY"
    script:
        - rsync -Prlt --delete docs/_build/html/ $UPLOAD_PATH
    dependencies:
        - build docs

# ---
# 'lint' stage jobs.
# ---

pre-commit:
    stage: lint
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    image: registry.gitlab.com/cahute/docker-images/pre-commit:latest
    script:
        - pre-commit run -v --all-files

