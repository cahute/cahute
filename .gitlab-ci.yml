build next docs:
    extends: .build docs
    rules:
        - if: $CI_COMMIT_BRANCH == "develop"
        - if: $CI_COMMIT_TAG
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          changes:
          - "docs/**/*"
          - ".gitlab-ci.yml"
    variables:
        IS_PREVIEW: "y"

build release docs:
    extends: .build docs
    rules:
        - if: $CI_COMMIT_TAG

# ---
# 'package' stage jobs.
# ---

package source:
    stage: package
    rules:
        - if: $CI_COMMIT_BRANCH == "develop"
        - if: $CI_COMMIT_TAG
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          changes:
          - ".gitlab-ci.yml"
    image: registry.gitlab.com/cahute/docker-images/package-source:latest
    script:
        - >
            cmake -B build -S .
            -DCAHUTE_CLI=OFF -DCAHUTE_GIT=OFF -DCAHUTE_LIBUSB=OFF
            -DCAHUTE_PKGCONF=OFF -DCAHUTE_SDL=OFF -DCAHUTE_UDEV=OFF
        - cpack --config build/CPackSourceConfig.cmake
    dependencies: []
    artifacts:
        paths:
            - cahute-*.tar.gz

package for debian (amd64):
    extends: .package for debian
    image: registry.gitlab.com/cahute/docker-images/x86_64-pc-linux-gnu:latest
    dependencies:
        - build (x86_64-pc-linux-gnu, debian)

