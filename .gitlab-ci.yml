# ---
# 'lint packages' stage jobs.
# ---

lint debian packages:
    stage: lint packages
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          changes:
          - ".gitlab-ci.yml"
          - "CMakeLists.txt"
    image: registry.gitlab.com/cahute/docker-images/lintian:latest
    script:
        - >
            lintian build/*.deb
            --suppress-tags no-changelog,no-manual-page
    dependencies:
        - package for debian (amd64)
        #- package for debian (i386)
        - package for debian (armhf)
        - package for debian (arm64)
        - package for debian (ppc64el)
        #- package for debian (riscv64)
        - package for debian (s390x)

# ---
# 'publish' stage jobs.
# ---

publish next docs:
    extends: .publish docs
    rules:
        - if: $CI_COMMIT_BRANCH == "develop"
        - if: $CI_COMMIT_TAG
    variables:
        UPLOAD_PATH: "$CAHUTE_NEXT_UPLOAD_PATH"
    dependencies:
        - build next docs

publish release docs:
    extends: .publish docs
    rules:
        - if: $CI_COMMIT_TAG
    variables:
        UPLOAD_PATH: "$CAHUTE_DOCS_UPLOAD_PATH"
    dependencies:
        - build release docs

publish source:
    stage: publish
    rules:
        - if: $CI_COMMIT_TAG
          when: always
    image: registry.gitlab.com/cahute/docker-images/rsync:latest
    before_script:
        - chmod 400 "$SSH_PRIVATE_KEY"
        - ssh-add "$SSH_PRIVATE_KEY"
    script:
        - export RELEASE_FILE=$(ls cahute-*.tar.gz)
        - sha256sum $RELEASE_FILE >$RELEASE_FILE.sha256
        - b2sum $RELEASE_FILE >$RELEASE_FILE.b2
        - >
            scp $RELEASE_FILE $RELEASE_FILE.sha256 $RELEASE_FILE.b2
            $CAHUTE_FTP_UPLOAD_PATH/releases
    dependencies:
        - package source
