stages:
  - lint
  - build
  - package
  - publish

pre-commit:
    stage: lint
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    image: registry.gitlab.com/cahuteproject/docker-images/pre-commit:latest
    script:
        - pre-commit run -v --all-files

build (x86_64-pc-linux-gnu):
    stage: build
    rules:
        - if: $CI_COMMIT_BRANCH == "develop"
        - if: $CI_COMMIT_TAG
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          changes:
          - "chars/**/*"
          - "cli/**/*"
          - "common/**/*"
          - "include/**/*"
          - "lib/**/*"
          - ".gitlab-ci.yml"
    image: registry.gitlab.com/cahuteproject/docker-images/x86_64-pc-linux-gnu:latest
    script:
        - >
            cmake -B build-x86_64-pc-linux-gnu -S .
            -DCMAKE_BUILD_TYPE=Release -DCAHUTE_CLI_EXPERIMENTAL=ON
        - cmake --build build-x86_64-pc-linux-gnu

